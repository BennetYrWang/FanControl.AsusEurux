name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FANCONTROL_VERSION: '273'

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore FanControl plugin API
        shell: pwsh
        run: .\scripts\restore-fancontrol-sdk.ps1 -Version $env:FANCONTROL_VERSION

      - name: Build and test
        shell: pwsh
        run: |
          dotnet build .\AsusFanControlBridge.slnx -c Release -p:FanControlDir="$PWD\.deps\FanControl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          .\scripts\package.ps1 -FanControlDir "$PWD\.deps\FanControl" -Version $version

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' .\artifacts\*.zip .\artifacts\*.sha256 --verify-tag --generate-notes
